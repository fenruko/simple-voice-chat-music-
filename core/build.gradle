plugins { id 'java-library' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://maven.lavalink.dev/releases' }
}

dependencies {
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    implementation("dev.arbjerg:lavaplayer:${lavaplayer_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-api' // use the host server's logger provider
    }
    implementation "dev.lavalink.youtube:v2:${youtube_source_version}"
    implementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_source_smoke:
        description: 'Try real YouTube and SoundCloud sources and verify Lavaplayer decodes audio (network-dependent)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: bash .github/scripts/gradle-ci.sh tests :core:test
      - name: Server behaviour simulation
        env:
          PYTHONUTF8: 1
        run: |
          python3 -V
          python3 simulation/run_tests.py
      - name: Live YouTube audio-source smoke test
        if: (github.event_name == 'workflow_dispatch' && inputs.live_source_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-source-smoke]'))
        continue-on-error: true
        run: bash .github/scripts/gradle-ci.sh youtube-source-smoke :core:sourceSmokeTest -PsourceSmokeUrl=https://www.youtube.com/watch?v=dQw4w9WgXcQ
      - name: Live SoundCloud audio-source smoke test
        if: (github.event_name == 'workflow_dispatch' && inputs.live_source_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-source-smoke]'))
        continue-on-error: true
        run: bash .github/scripts/gradle-ci.sh soundcloud-source-smoke :core:sourceSmokeTest -PsourceSmokeUrl=https://soundcloud.com/joakimkarud/dizzy
      - name: Build server jars
        id: build
        if: ${{ !cancelled() }}
        run: bash .github/scripts/gradle-ci.sh build :fabric:build :paper:build
      - name: Verify server JAR integrity and platform metadata
        if: steps.build.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile

          def verify():
            fabric = pathlib.Path('fabric/build/libs/voice-music-fabric-0.1.0-SNAPSHOT.jar')
            paper = pathlib.Path('paper/build/libs/voice-music-paper-0.1.0-SNAPSHOT.jar')
            for jar in (fabric, paper):
                assert jar.is_file(), f'missing JAR: {jar}'
                size = jar.stat().st_size
                assert size > 16_000, f'unexpectedly small JAR: {jar} ({size} bytes)'
                print(f'::notice title=Built server JAR::{jar}: {size:,} bytes')
                with zipfile.ZipFile(jar) as archive:
                    assert archive.testzip() is None, f'CRC error in {jar}'
                digest = hashlib.sha256(jar.read_bytes()).hexdigest()
                with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                    summary.write(f'- `{jar}` — {jar.stat().st_size:,} bytes, SHA-256 `{digest}`\n')

            with zipfile.ZipFile(fabric) as archive:
                names = set(archive.namelist())
                mod = json.loads(archive.read('fabric.mod.json'))
                assert mod['environment'] == 'server'
                assert 'voicechat' in mod['entrypoints']
                assert 'dev/arena/voicemusic/fabric/VoiceMusicFabric.class' in names
                nested = [name for name in names if name.startswith('META-INF/jars/') and name.endswith('.jar')]
                assert nested, 'Fabric core/dependencies were not bundled'
                nested_names = set()
                for name in nested:
                    with zipfile.ZipFile(io.BytesIO(archive.read(name))) as dependency:
                        nested_names.update(dependency.namelist())
                assert 'dev/arena/voicemusic/audio/MusicRuntime.class' in nested_names
                # Loom's `include` is non-transitive, so nesting lavaplayer alone is not
                # enough: DefaultAudioPlayerManager's constructor needs DaemonThreadFactory
                # from dev.arbjerg:lava-common. Without these the server hits
                # NoClassDefFoundError during mod init and /music never exists.
                # Match on class suffix because shadowJar relocates packages on the Paper
                # side (relocating com.grack -> ...internal.nanojson turns
                # com.grack.nanojson.JsonParser into ...internal.nanojson.nanojson.JsonParser).
                audio_engine = {
                    'dev.arbjerg:lavaplayer': ['lavaplayer/player/DefaultAudioPlayerManager.class'],
                    'dev.arbjerg:lava-common': ['com/sedmelluq/lava/common/tools/DaemonThreadFactory.class'],
                    'org.mozilla:rhino-engine': ['mozilla/javascript/Script.class',
                                                 'mozilla/javascript/Context.class',
                                                 'mozilla/javascript/engine/RhinoScriptEngineFactory.class'],
                    'com.grack:nanojson': ['nanojson/JsonParser.class'],
                    'org.jsoup:jsoup': ['jsoup/nodes/Element.class'],
                    'org.apache.httpcomponents:httpclient': ['apache/http/client/HttpClient.class'],
                    'com.fasterxml.jackson.core:jackson-core': ['fasterxml/jackson/core/JsonFactory.class'],
                }
                missing = [lib for lib, suffixes in audio_engine.items()
                           if not any(entry.endswith(suffix) for entry in nested_names for suffix in suffixes)]
                assert not missing, f'Fabric JAR is missing nested audio engine libraries: {missing}'

            with zipfile.ZipFile(paper) as archive:
                names = set(archive.namelist())
                descriptor = archive.read('plugin.yml').decode()
                assert 'main: dev.arena.voicemusic.paper.VoiceMusicPaper' in descriptor
                assert 'depend: [voicechat]' in descriptor
                assert 'dev/arena/voicemusic/paper/VoiceMusicPaper.class' in names
                assert 'dev/arena/voicemusic/audio/MusicRuntime.class' in names
                assert any(name.startswith('dev/arena/voicemusic/internal/lavaplayer/') for name in names)
                paper_missing = [lib for lib, suffixes in audio_engine.items()
                                 if not any(name.endswith(suffix) for name in names for suffix in suffixes)]
                assert not paper_missing, f'Paper JAR is missing audio engine classes: {paper_missing}'

          try:
              verify()
          except Exception as error:
              print(f"::error title=Server JAR validation::{type(error).__name__}: {error}")
              raise
          PY
      - name: Upload server JARs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: voice-music-server-jars
          path: |
            fabric/build/libs/voice-music-fabric-0.1.0-SNAPSHOT.jar
            paper/build/libs/voice-music-paper-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voice-music-diagnostics
          path: ci-logs/*.log
          if-no-files-found: ignore

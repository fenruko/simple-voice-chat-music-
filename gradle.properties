org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false
project_version=0.1.0-SNAPSHOT
minecraft_version=26.3
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
voicechat_api_version=2.6.24
lavaplayer_version=2.2.7
youtube_source_version=1.18.2

# Version of Simple Voice Chat used for the local development runtime. This is only a
# runtime dependency for testing; users install whichever SVC build they like.
simple_voice_chat_version=2.6.23+26.3

# Dependency ranges written into fabric.mod.json.
#
# These MUST stay permissive. Fabric Loader silently drops a mod whose dependency
# ranges are not satisfied, and a dropped mod looks exactly like "nothing happens":
# no entrypoints run, no /music command, no error in the player-visible log.
#
# minecraft_dependency matches Simple Voice Chat's own "26.3.x" - an exact pin such as
#   "minecraft": "=26.3"
# rejects every 26.3.x patch release of the server.
#
# voicechat_api is the API module Simple Voice Chat bundles inside its own jar. It is
# pinned by the installed SVC build, not by this mod, so it cannot be range-checked
# from here. ">=2.6.24" used to reject every SVC build that bundles an older API
# (including the SVC build this project's own dev runtime pins).
minecraft_dependency=26.3.x
loader_dependency=>=0.19.3
